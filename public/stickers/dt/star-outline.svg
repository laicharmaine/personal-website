<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 164" fill="none">
  <defs>

    <filter id="die" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


  </defs>
  <g transform="translate(16 16)" filter="url(#die)">

    <path d="M70 4 L84 52 L132 66 L84 80 L70 128 L56 80 L8 66 L56 52 Z" fill="none" stroke="#171717" stroke-width="9" stroke-linejoin="miter"/>
    
  </g>
</svg>
