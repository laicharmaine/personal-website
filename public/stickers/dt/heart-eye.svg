<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" fill="none">
  <defs>

    <filter id="die" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


  </defs>
  <g transform="translate(16 16)" filter="url(#die)">

    <path fill="#8a0e22" d="M70 132 C 12 92 -8 56 24 24 C 40 8 58 16 70 40 C 82 16 100 8 116 24 C 148 56 128 92 70 132 Z"/>
    <path fill="#c8102e" d="M70 124 C 20 88 4 56 28 28 C 42 14 58 22 70 44 C 82 22 98 14 112 28 C 136 56 120 88 70 124 Z"/>
    <!-- eye -->
    <ellipse cx="70" cy="72" rx="28" ry="18" fill="#f3eee4"/>
    <ellipse cx="70" cy="72" rx="28" ry="18" fill="none" stroke="#171717" stroke-width="2"/>
    <circle cx="70" cy="72" r="11" fill="#171717"/>
    <circle cx="70" cy="72" r="6" fill="#3a3230"/>
    <circle cx="74" cy="68" r="3" fill="#fff"/>
    <path d="M44 58 Q 70 48 96 58" fill="none" stroke="#171717" stroke-width="2.2" stroke-linecap="round"/>
    
  </g>
</svg>
