    <path d="M64 42 C 72 36 86 36 94 42" fill="none" stroke="#c8102e" stroke-width="6" stroke-linecap="round"/>
    <path fill="#fff" opacity=".25" d="M30 36 C 36 30 44 32 48 38"/>
    
  </g>
</svg>
