<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 180" fill="none">
  <defs>

    <filter id="die" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


  </defs>
  <g transform="translate(16 16)" filter="url(#die)">

    <rect x="8" y="40" width="164" height="96" rx="14" fill="#f3eee4"/>
    <rect x="8" y="40" width="164" height="96" rx="14" fill="none" stroke="#c8c0b4" stroke-width="1.5"/>
    <rect x="8" y="40" width="164" height="22" rx="14" fill="#e8e0d4"/>
    <rect x="8" y="54" width="164" height="10" fill="#f3eee4"/>
    <rect x="24" y="22" width="40" height="24" rx="4" fill="#d8d0c4"/>
    <circle cx="108" cy="88" r="34" fill="#2a2a2a"/>
    <circle cx="108" cy="88" r="26" fill="#1a1a1a"/>
    <circle cx="108" cy="88" r="14" fill="#3a4a5a"/>
    <circle cx="108" cy="88" r="7" fill="#1a1a1a"/>
    <circle cx="100" cy="80" r="4" fill="#fff" opacity=".35"/>
    <circle cx="36" cy="88" r="8" fill="#c8102e"/>
    <rect x="28" y="48" width="22" height="8" rx="2" fill="#bbb"/>
    
  </g>
</svg>
