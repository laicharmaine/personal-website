    <path d="M64 30 C 100 18 112 60 88 80" fill="none" stroke="#171717" stroke-width="2.2"/>
    <ellipse cx="64" cy="78" rx="5" ry="32" fill="#171717"/>
    <circle cx="64" cy="46" r="5" fill="#171717"/>
    <path d="M60 42 Q 48 16 40 12" fill="none" stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M68 42 Q 80 16 88 12" fill="none" stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="40" cy="12" r="2.4" fill="#171717"/>
    <circle cx="88" cy="12" r="2.4" fill="#171717"/>
    
  </g>
</svg>
