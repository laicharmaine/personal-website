<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 200" fill="none">
  <defs>

    <filter id="die" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


  </defs>
  <g transform="translate(16 16)" filter="url(#die)">

    <circle cx="36" cy="28" r="16" fill="#f3eee4" stroke="#c8c0b4" stroke-width="1"/>
    <circle cx="100" cy="28" r="16" fill="#f3eee4" stroke="#c8c0b4" stroke-width="1"/>
    <circle cx="36" cy="28" r="8" fill="#e8d8c8"/>
    <circle cx="100" cy="28" r="8" fill="#e8d8c8"/>
    <ellipse cx="20" cy="100" rx="14" ry="20" fill="#f3eee4"/>
    <ellipse cx="116" cy="100" rx="14" ry="20" fill="#f3eee4"/>
    <ellipse cx="44" cy="148" rx="18" ry="12" fill="#f3eee4"/>
    <ellipse cx="92" cy="148" rx="18" ry="12" fill="#f3eee4"/>
    <ellipse cx="68" cy="112" rx="40" ry="38" fill="#f3eee4"/>
    <circle cx="68" cy="54" r="32" fill="#f3eee4"/>
    <ellipse cx="68" cy="64" rx="16" ry="12" fill="#efe4d6"/>
    <ellipse cx="68" cy="60" rx="6" ry="4.2" fill="#171717"/>
    <circle cx="54" cy="48" r="4" fill="#171717"/>
    <circle cx="82" cy="48" r="4" fill="#171717"/>
    <circle cx="55.2" cy="46.6" r="1.3" fill="#fff"/>
    <circle cx="83.2" cy="46.6" r="1.3" fill="#fff"/>
    <path d="M68 64 Q 62 72 56 70" fill="none" stroke="#171717" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M68 64 Q 74 72 80 70" fill="none" stroke="#171717" stroke-width="1.5" stroke-linecap="round"/>
    <!-- tiny red bow -->
    <path fill="#c8102e" d="M68 86 L 54 78 L 54 94 Z"/>
    <path fill="#c8102e" d="M68 86 L 82 78 L 82 94 Z"/>
    <circle cx="68" cy="86" r="4" fill="#8a0e22"/>
    
  </g>
</svg>
