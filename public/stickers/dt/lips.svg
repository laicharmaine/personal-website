    <path fill="#c8102e" d="M28 48 C 48 58 92 58 112 48 C 100 66 84 76 70 76 C 56 76 40 66 28 48 Z"/>
    <path fill="#7a1230" opacity=".85" d="M32 50 C 48 60 92 60 108 50 C 96 64 82 72 70 72 C 58 72 44 64 32 50 Z"/>
    <path fill="#fff" opacity=".35" d="M40 40 C 48 34 56 36 62 44 C 52 44 44 44 40 40 Z"/>
    
  </g>
</svg>
