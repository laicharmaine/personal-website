<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 160" fill="none">
  <defs>

    <filter id="die" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


  </defs>
  <g transform="translate(16 16)" filter="url(#die)">

    <rect x="4" y="20" width="168" height="100" rx="8" fill="#171717"/>
    <rect x="14" y="30" width="148" height="54" rx="4" fill="#2a2a2a"/>
    <rect x="22" y="36" width="52" height="42" rx="3" fill="#3a3a3a"/>
    <rect x="102" y="36" width="52" height="42" rx="3" fill="#3a3a3a"/>
    <circle cx="48" cy="57" r="14" fill="#f3eee4"/>
    <circle cx="128" cy="57" r="14" fill="#f3eee4"/>
    <circle cx="48" cy="57" r="6" fill="#171717"/>
    <circle cx="128" cy="57" r="6" fill="#171717"/>
    <rect x="58" y="46" width="60" height="22" rx="2" fill="#f3eee4"/>
    <rect x="20" y="92" width="136" height="18" rx="2" fill="#222"/>
    <rect x="28" y="96" width="18" height="10" fill="#c8102e"/>
    <rect x="52" y="96" width="10" height="10" fill="#f3eee4"/>
    
  </g>
</svg>
