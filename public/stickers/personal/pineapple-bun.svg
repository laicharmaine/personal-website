<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 184" fill="none">
  <defs>
    <filter id="die-pineapple-bun" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-pineapple-bun)">

    <ellipse cx="100" cy="118" rx="78" ry="30" fill="#f3eee4"/>
    <path d="M24 100 Q 24 40 100 28 Q 176 40 176 100 Q 176 130 100 138 Q 24 130 24 100 Z" fill="#f3eee4"/>
    <path d="M24 100 Q 24 40 100 28 Q 176 40 176 100 Q 176 130 100 138 Q 24 130 24 100 Z" fill="none" stroke="#171717" stroke-width="4"/>
    <!-- cookie crust cap, light pink-cream -->
    <path d="M36 96 Q 40 44 100 34 Q 160 44 164 96 Q 150 108 100 112 Q 50 108 36 96 Z" fill="#ff4f8b"/>
    <path d="M36 96 Q 40 44 100 34 Q 160 44 164 96 Q 150 108 100 112 Q 50 108 36 96 Z" fill="none" stroke="#171717" stroke-width="3"/>
    <!-- pineapple check, cream lines so it reads as sugar crust -->
    <g fill="none" stroke="#f3eee4" stroke-width="3.4" stroke-linecap="round">
      <path d="M52 56 L 148 96"/>
      <path d="M64 48 L 156 86"/>
      <path d="M86 40 L 160 74"/>
      <path d="M44 72 L 132 108"/>
      <path d="M148 56 L 52 96"/>
      <path d="M156 72 L 64 108"/>
      <path d="M160 48 L 80 100"/>
      <path d="M130 40 L 44 80"/>
    </g>
    <ellipse cx="70" cy="118" rx="16" ry="6" fill="#ffffff" opacity="0.35"/>

  </g>
</svg>
