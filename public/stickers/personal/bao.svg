<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 192" fill="none">
  <defs>
    <filter id="die-bao" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-bao)">

    <!-- shadow / underside -->
    <ellipse cx="100" cy="128" rx="78" ry="22" fill="#2a1818"/>
    <!-- body -->
    <path d="M24 100
             Q 20 48 100 24
             Q 180 48 176 100
             Q 172 140 100 148
             Q 28 140 24 100 Z" fill="#f3eee4"/>
    <path d="M24 100
             Q 20 48 100 24
             Q 180 48 176 100
             Q 172 140 100 148
             Q 28 140 24 100 Z" fill="none" stroke="#171717" stroke-width="4"/>
    <!-- pinched folds at the crown -->
    <g fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round">
      <path d="M100 28 Q 100 70 100 86"/>
      <path d="M100 28 Q 78 68 70 88"/>
      <path d="M100 28 Q 122 68 130 88"/>
      <path d="M100 28 Q 60 58 52 80"/>
      <path d="M100 28 Q 140 58 148 80"/>
    </g>
    <!-- tiny filling peek, cherry -->
    <circle cx="100" cy="40" r="6" fill="#c8102e"/>
    <!-- highlight -->
    <ellipse cx="68" cy="72" rx="14" ry="8" transform="rotate(-30 68 72)" fill="#ffffff" opacity="0.4"/>

  </g>
</svg>
