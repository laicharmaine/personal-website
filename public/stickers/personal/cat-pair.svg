<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 242 188" fill="none">
  <defs>
    <filter id="die-cat-pair" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-cat-pair)">

    <!-- black cat, sitting, left, slightly behind -->
    <path d="M70 128 C 98 120 104 84 86 76" fill="none" stroke="#171717" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="48" cy="118" rx="32" ry="28" fill="#171717"/>
    <circle cx="48" cy="70" r="28" fill="#171717"/>
    <path d="M26 58 L 18 28 L 44 50 Z" fill="#171717"/>
    <path d="M70 58 L 78 28 L 52 50 Z" fill="#171717"/>
    <path d="M26 54 L 22 34 L 40 50 Z" fill="#2a1818"/>
    <path d="M70 54 L 74 34 L 56 50 Z" fill="#2a1818"/>
    <ellipse cx="38" cy="70" rx="6.5" ry="7.5" fill="#f3eee4"/>
    <ellipse cx="60" cy="70" rx="6.5" ry="7.5" fill="#f3eee4"/>
    <ellipse cx="39" cy="71" rx="2.4" ry="4.6" fill="#171717"/>
    <ellipse cx="61" cy="71" rx="2.4" ry="4.6" fill="#171717"/>
    <circle cx="36.5" cy="67.5" r="1.3" fill="#ffffff"/>
    <circle cx="58.5" cy="67.5" r="1.3" fill="#ffffff"/>
    <path d="M48 80 L 45 86 L 51 86 Z" fill="#2a1818"/>
    <!-- cream cat, sitting, right, slightly in front -->
    <path d="M150 132 C 182 124 184 86 164 80" fill="none" stroke="#f3eee4" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="132" cy="122" rx="34" ry="30" fill="#f3eee4"/>
    <circle cx="132" cy="74" r="30" fill="#f3eee4"/>
    <path d="M108 62 L 100 30 L 128 54 Z" fill="#f3eee4"/>
    <path d="M156 62 L 164 30 L 136 54 Z" fill="#f3eee4"/>
    <path d="M110 58 L 106 38 L 124 54 Z" fill="#ff4f8b"/>
    <path d="M154 58 L 158 38 L 140 54 Z" fill="#ff4f8b"/>
    <ellipse cx="121" cy="74" rx="7" ry="8" fill="#171717"/>
    <ellipse cx="145" cy="74" rx="7" ry="8" fill="#171717"/>
    <ellipse cx="122" cy="75" rx="2.6" ry="5" fill="#f3eee4"/>
    <ellipse cx="146" cy="75" rx="2.6" ry="5" fill="#f3eee4"/>
    <path d="M132 86 L 128 94 L 136 94 Z" fill="#c8102e"/>
    <path d="M124 100 Q 132 106 140 100" fill="none" stroke="#171717" stroke-width="1.8" stroke-linecap="round"/>
    <!-- blush on cream cat -->
    <ellipse cx="112" cy="86" rx="6" ry="3.5" fill="#ff4f8b"/>
    <ellipse cx="152" cy="86" rx="6" ry="3.5" fill="#ff4f8b"/>

  </g>
</svg>
