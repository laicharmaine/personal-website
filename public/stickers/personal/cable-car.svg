<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 192" fill="none">
  <defs>
    <filter id="die-cable-car" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-cable-car)">

    <!-- trolley pole -->
    <path d="M128 8 L 168 2" fill="none" stroke="#171717" stroke-width="5" stroke-linecap="round"/>
    <circle cx="168" cy="2" r="4" fill="#171717"/>
    <!-- roof -->
    <path d="M16 40 L 20 24 Q 24 14 40 14 L 168 14 Q 182 14 186 26 L 188 40 Z" fill="#c8102e"/>
    <rect x="22" y="20" width="150" height="8" rx="2" fill="#2a1818"/>
    <!-- clerestory / upper windows -->
    <rect x="28" y="40" width="148" height="18" fill="#171717"/>
    <g fill="#f3eee4">
      <rect x="34" y="43" width="18" height="12" rx="1.5"/>
      <rect x="58" y="43" width="18" height="12" rx="1.5"/>
      <rect x="82" y="43" width="18" height="12" rx="1.5"/>
      <rect x="106" y="43" width="18" height="12" rx="1.5"/>
      <rect x="130" y="43" width="18" height="12" rx="1.5"/>
      <rect x="154" y="43" width="14" height="12" rx="1.5"/>
    </g>
    <!-- body -->
    <rect x="16" y="58" width="172" height="64" rx="3" fill="#f3eee4"/>
    <!-- cherry waist stripe -->
    <rect x="16" y="86" width="172" height="10" fill="#c8102e"/>
    <!-- end platforms slightly darker -->
    <rect x="16" y="58" width="22" height="64" fill="#f3eee4"/>
    <rect x="166" y="58" width="22" height="64" fill="#f3eee4"/>
    <!-- main windows -->
    <g fill="#171717">
      <rect x="44" y="64" width="28" height="20" rx="2"/>
      <rect x="80" y="64" width="28" height="20" rx="2"/>
      <rect x="116" y="64" width="28" height="20" rx="2"/>
    </g>
    <!-- door opening -->
    <rect x="150" y="64" width="14" height="48" rx="2" fill="#171717"/>
    <rect x="24" y="64" width="12" height="48" rx="2" fill="#171717"/>
    <!-- running board -->
    <rect x="10" y="120" width="184" height="8" rx="2" fill="#171717"/>
    <!-- cowcatcher / bumper -->
    <path d="M4 122 L 16 122 L 16 132 L 0 132 Z" fill="#171717"/>
    <path d="M188 122 L 200 122 L 204 132 L 188 132 Z" fill="#171717"/>
    <!-- bell -->
    <circle cx="36" cy="30" r="6" fill="#ff4f8b"/>
    <rect x="34" y="22" width="4" height="8" fill="#171717"/>
    <!-- wheels + trucks -->
    <rect x="36" y="126" width="44" height="10" rx="2" fill="#2a1818"/>
    <rect x="124" y="126" width="44" height="10" rx="2" fill="#2a1818"/>
    <circle cx="48" cy="142" r="12" fill="#171717"/>
    <circle cx="48" cy="142" r="5" fill="#f3eee4"/>
    <circle cx="68" cy="142" r="12" fill="#171717"/>
    <circle cx="68" cy="142" r="5" fill="#f3eee4"/>
    <circle cx="136" cy="142" r="12" fill="#171717"/>
    <circle cx="136" cy="142" r="5" fill="#f3eee4"/>
    <circle cx="156" cy="142" r="12" fill="#171717"/>
    <circle cx="156" cy="142" r="5" fill="#f3eee4"/>
    <!-- cable slot hint under the car -->
    <rect x="90" y="150" width="24" height="4" rx="1" fill="#c8102e"/>

  </g>
</svg>
