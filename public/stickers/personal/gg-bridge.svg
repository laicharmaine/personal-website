<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 164" fill="none">
  <defs>
    <filter id="die-gg-bridge" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-gg-bridge)">

    <!-- fog banks -->
    <ellipse cx="110" cy="118" rx="108" ry="22" fill="#f3eee4"/>
    <ellipse cx="40" cy="112" rx="46" ry="16" fill="#ffffff"/>
    <ellipse cx="180" cy="114" rx="50" ry="18" fill="#ffffff"/>
    <!-- hills -->
    <path d="M0 108 Q 18 70 40 108 Z" fill="#171717"/>
    <path d="M220 108 Q 204 66 182 108 Z" fill="#171717"/>
    <!-- cables (behind deck) -->
    <path d="M40 86 Q 110 8 180 86" fill="none" stroke="#c8102e" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 86 Q 74 54 110 86" fill="none" stroke="#c8102e" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M110 86 Q 146 54 180 86" fill="none" stroke="#c8102e" stroke-width="3.5" stroke-linecap="round"/>
    <!-- suspender lines -->
    <g stroke="#c8102e" stroke-width="2">
      <line x1="58" y1="64" x2="58" y2="86"/>
      <line x1="74" y1="50" x2="74" y2="86"/>
      <line x1="90" y1="42" x2="90" y2="86"/>
      <line x1="130" y1="42" x2="130" y2="86"/>
      <line x1="146" y1="50" x2="146" y2="86"/>
      <line x1="162" y1="64" x2="162" y2="86"/>
    </g>
    <!-- deck -->
    <rect x="20" y="84" width="180" height="10" rx="2" fill="#c8102e"/>
    <rect x="20" y="92" width="180" height="4" fill="#2a1818"/>
    <!-- towers -->
    <g fill="#c8102e">
      <rect x="36" y="18" width="12" height="86"/>
      <rect x="52" y="18" width="12" height="86"/>
      <rect x="34" y="18" width="32" height="10"/>
      <rect x="36" y="42" width="28" height="7"/>
      <rect x="36" y="64" width="28" height="7"/>
      <rect x="156" y="18" width="12" height="86"/>
      <rect x="172" y="18" width="12" height="86"/>
      <rect x="154" y="18" width="32" height="10"/>
      <rect x="156" y="42" width="28" height="7"/>
      <rect x="156" y="64" width="28" height="7"/>
    </g>
    <!-- tower tops -->
    <rect x="38" y="8" width="8" height="12" fill="#c8102e"/>
    <rect x="54" y="8" width="8" height="12" fill="#c8102e"/>
    <rect x="158" y="8" width="8" height="12" fill="#c8102e"/>
    <rect x="174" y="8" width="8" height="12" fill="#c8102e"/>

  </g>
</svg>
