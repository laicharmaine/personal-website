<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 198" fill="none">
  <defs>
    <filter id="die-speaker" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-speaker)">

    <rect x="16" y="8" width="120" height="150" rx="16" fill="#171717"/>
    <!-- tweeter -->
    <circle cx="76" cy="40" r="16" fill="#f3eee4"/>
    <circle cx="76" cy="40" r="8" fill="#ff4f8b"/>
    <!-- woofer -->
    <circle cx="76" cy="108" r="44" fill="#c8102e"/>
    <circle cx="76" cy="108" r="30" fill="#e0263f"/>
    <circle cx="76" cy="108" r="14" fill="#171717"/>
    <circle cx="76" cy="108" r="6" fill="#f3eee4"/>
    <!-- handle slot -->
    <rect x="50" y="14" width="52" height="8" rx="3" fill="#2a1818"/>

  </g>
</svg>
