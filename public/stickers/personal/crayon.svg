<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 208" fill="none">
  <defs>
    <filter id="die-crayon" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-crayon)">

    <!-- tip -->
    <path d="M80 8 L 104 48 L 56 48 Z" fill="#c8102e"/>
    <path d="M80 8 L 104 48 L 56 48 Z" fill="none" stroke="#171717" stroke-width="3" stroke-linejoin="round"/>
    <!-- paper wrapper -->
    <rect x="56" y="48" width="48" height="100" fill="#f3eee4"/>
    <rect x="56" y="48" width="48" height="100" fill="none" stroke="#171717" stroke-width="3"/>
    <!-- color band, no words -->
    <rect x="56" y="70" width="48" height="36" fill="#c8102e"/>
    <rect x="56" y="82" width="48" height="12" fill="#ff4f8b"/>
    <!-- end -->
    <rect x="56" y="148" width="48" height="16" rx="3" fill="#c8102e"/>
    <rect x="56" y="148" width="48" height="16" rx="3" fill="none" stroke="#171717" stroke-width="3"/>
    <!-- wrapper folded edge -->
    <path d="M56 48 L 80 58 L 104 48" fill="none" stroke="#171717" stroke-width="3" stroke-linejoin="round"/>

  </g>
</svg>
