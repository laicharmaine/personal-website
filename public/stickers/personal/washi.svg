<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 200" fill="none">
  <defs>
    <filter id="die-washi" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-washi)">

    <!-- trailing strip -->
    <path d="M108 70 L 196 78 L 192 118 L 108 106 Z" fill="#ff4f8b"/>
    <path d="M108 70 L 196 78 L 192 118 L 108 106 Z" fill="none" stroke="#171717" stroke-width="3"/>
    <!-- pattern on strip: dots + a stripe -->
    <g fill="#f3eee4">
      <circle cx="130" cy="90" r="5"/>
      <circle cx="152" cy="94" r="5"/>
      <circle cx="174" cy="98" r="5"/>
    </g>
    <path d="M118 80 L 190 86 L 188 94 L 116 88 Z" fill="#c8102e"/>
    <!-- roll -->
    <ellipse cx="78" cy="90" rx="62" ry="62" fill="#c8102e"/>
    <ellipse cx="78" cy="90" rx="62" ry="62" fill="none" stroke="#171717" stroke-width="3"/>
    <!-- inner core -->
    <ellipse cx="78" cy="90" rx="22" ry="22" fill="#f3eee4"/>
    <ellipse cx="78" cy="90" rx="22" ry="22" fill="none" stroke="#171717" stroke-width="3"/>
    <ellipse cx="78" cy="90" rx="10" ry="10" fill="#171717"/>
    <!-- pattern on roll: cream stars/dots -->
    <g fill="#f3eee4">
      <circle cx="78" cy="42" r="6"/>
      <circle cx="118" cy="58" r="5"/>
      <circle cx="126" cy="96" r="6"/>
      <circle cx="106" cy="128" r="5"/>
      <circle cx="50" cy="128" r="6"/>
      <circle cx="32" cy="96" r="5"/>
      <circle cx="40" cy="58" r="6"/>
    </g>
    <!-- pink stripe arc -->
    <path d="M36 70 Q 78 48 120 70" fill="none" stroke="#ff4f8b" stroke-width="7" stroke-linecap="round"/>

  </g>
</svg>
