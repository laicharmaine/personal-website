<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 222 186" fill="none">
  <defs>
    <filter id="die-ice-skate" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-ice-skate)">

    <!-- blade (side profile) -->
    <path d="M22 132 L 28 116 L 176 116 L 176 128 L 170 128 L 168 146 L 156 146 L 154 128 L 40 128 L 34 146 L 22 146 L 22 132 Z" fill="#171717"/>
    <!-- toe picks -->
    <path d="M22 116 L 14 102 L 22 110 L 26 116 Z" fill="#171717"/>
    <path d="M30 116 L 24 100 L 34 112 Z" fill="#171717"/>
    <path d="M38 116 L 34 104 L 42 112 Z" fill="#171717"/>
    <!-- heel stanchion already in blade path -->
    <!-- boot body -->
    <path d="M52 116
             L 50 78
             Q 48 48 78 36
             L 118 28
             Q 148 24 156 48
             L 160 78
             Q 162 100 148 116
             Z" fill="#c8102e"/>
    <!-- sole -->
    <path d="M52 100 L 50 116 L 148 116 Q 160 116 158 100 Q 140 108 52 100 Z" fill="#2a1818"/>
    <!-- cream cuff / opening -->
    <path d="M74 40
             L 70 62
             L 142 52
             L 140 34
             Q 130 26 110 28
             L 86 34
             Q 74 36 74 40 Z" fill="#f3eee4"/>
    <!-- tongue -->
    <path d="M96 48 L 94 78 L 116 74 L 116 46 Z" fill="#ff4f8b"/>
    <!-- laces -->
    <g stroke="#f3eee4" stroke-width="3.2" stroke-linecap="round">
      <path d="M86 70 L 122 64"/>
      <path d="M88 82 L 122 76"/>
      <path d="M90 94 L 122 88"/>
      <path d="M90 70 L 118 88"/>
      <path d="M120 64 L 92 94"/>
    </g>
    <g fill="#171717">
      <circle cx="86" cy="70" r="2.5"/>
      <circle cx="122" cy="64" r="2.5"/>
      <circle cx="88" cy="82" r="2.5"/>
      <circle cx="122" cy="76" r="2.5"/>
    </g>

  </g>
</svg>
