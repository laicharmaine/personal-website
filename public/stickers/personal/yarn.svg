<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 208" fill="none">
  <defs>
    <filter id="die-yarn" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-yarn)">

    <!-- needles behind -->
    <path d="M20 28 L 132 148" fill="none" stroke="#171717" stroke-width="7" stroke-linecap="round"/>
    <path d="M168 22 L 44 154" fill="none" stroke="#171717" stroke-width="7" stroke-linecap="round"/>
    <!-- needle tips -->
    <path d="M132 148 L 140 164 L 124 156 Z" fill="#171717"/>
    <path d="M44 154 L 32 168 L 50 160 Z" fill="#171717"/>
    <!-- yarn ball -->
    <circle cx="94" cy="88" r="52" fill="#c8102e"/>
    <circle cx="94" cy="88" r="52" fill="none" stroke="#171717" stroke-width="3"/>
    <!-- yarn curves -->
    <g fill="none" stroke="#ff4f8b" stroke-width="4" stroke-linecap="round">
      <path d="M54 70 Q 94 40 134 70"/>
      <path d="M50 88 Q 94 58 138 88"/>
      <path d="M54 106 Q 94 78 134 106"/>
      <path d="M62 122 Q 94 100 126 122"/>
      <path d="M70 58 Q 94 78 118 58"/>
    </g>
    <g fill="none" stroke="#2a1818" stroke-width="2.4" stroke-linecap="round">
      <path d="M58 78 Q 94 54 130 78"/>
      <path d="M56 98 Q 94 72 132 98"/>
    </g>
    <!-- loose strand -->
    <path d="M140 70 C 168 50 176 90 158 108" fill="none" stroke="#c8102e" stroke-width="6" stroke-linecap="round"/>
    <path d="M140 70 C 168 50 176 90 158 108" fill="none" stroke="#ff4f8b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- highlight -->
    <ellipse cx="74" cy="68" rx="10" ry="7" transform="rotate(-30 74 68)" fill="#ffffff" opacity="0.35"/>

  </g>
</svg>
