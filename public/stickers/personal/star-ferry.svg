<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 150" fill="none">
  <defs>
    <filter id="die-star-ferry" x="-30%" y="-30%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6.5" result="wide"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="wide" operator="in" result="border"/>
      <feOffset in="wide" dx="0.8" dy="3" result="off"/>
      <feGaussianBlur in="off" stdDeviation="2.1" result="blur"/>
      <feFlood flood-color="#171717" flood-opacity="0.18" result="shc"/>
      <feComposite in="shc" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(16 16)" filter="url(#die-star-ferry)">

    <!-- hull -->
    <path d="M16 86 Q 20 108 48 112 L 196 112 Q 214 108 214 90 L 214 78 L 16 78 Z" fill="#f3eee4"/>
    <path d="M16 86 Q 20 108 48 112 L 196 112 Q 214 108 214 90 L 200 90 L 48 90 Q 28 90 22 80 Z" fill="#171717"/>
    <!-- lower deck -->
    <rect x="28" y="56" width="176" height="24" rx="3" fill="#f3eee4"/>
    <rect x="28" y="56" width="176" height="24" rx="3" fill="none" stroke="#171717" stroke-width="3"/>
    <!-- upper deck cherry -->
    <rect x="52" y="26" width="128" height="32" rx="3" fill="#c8102e"/>
    <!-- wheelhouse -->
    <rect x="84" y="8" width="44" height="20" rx="3" fill="#171717"/>
    <rect x="90" y="12" width="10" height="10" rx="1.5" fill="#f3eee4"/>
    <rect x="106" y="12" width="16" height="10" rx="1.5" fill="#f3eee4"/>
    <!-- funnel -->
    <rect x="140" y="2" width="16" height="24" rx="3" fill="#171717"/>
    <rect x="140" y="2" width="16" height="7" rx="3" fill="#ff4f8b"/>
    <!-- windows lower -->
    <g fill="#171717">
      <rect x="40" y="62" width="16" height="12" rx="2"/>
      <rect x="64" y="62" width="16" height="12" rx="2"/>
      <rect x="88" y="62" width="16" height="12" rx="2"/>
      <rect x="112" y="62" width="16" height="12" rx="2"/>
      <rect x="136" y="62" width="16" height="12" rx="2"/>
      <rect x="160" y="62" width="16" height="12" rx="2"/>
      <rect x="184" y="62" width="12" height="12" rx="2"/>
    </g>
    <!-- windows upper -->
    <g fill="#f3eee4">
      <rect x="62" y="34" width="18" height="14" rx="2"/>
      <rect x="88" y="34" width="18" height="14" rx="2"/>
      <rect x="114" y="34" width="18" height="14" rx="2"/>
      <rect x="140" y="34" width="18" height="14" rx="2"/>
    </g>
    <!-- mast -->
    <rect x="72" y="0" width="3" height="26" fill="#171717"/>

  </g>
</svg>
